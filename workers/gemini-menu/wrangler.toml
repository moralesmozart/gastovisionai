# Cloudflare Worker — POST OCR text to Gemini (text-only generateContent; no image API).
#
#   cd workers/gemini-menu
#   npm i -g wrangler   # or use npx wrangler
#   wrangler login
#   wrangler secret put GEMINI_API_KEY
#   wrangler deploy
#
# Optional dashboard / wrangler vars:
#   ALLOWED_ORIGINS = https://youruser.github.io,https://www.yourdomain.com
#   GEMINI_MODEL    = gemini-2.5-flash   (optional; worker also tries flash-lite variants)

name = "gastovision-gemini-menu"
main = "src/index.js"
compatibility_date = "2025-01-01"
