<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"
    />
    <meta name="theme-color" content="#062927" id="themeColor" />
    <title>GastoVision — Video menus that sell themselves</title>
    <meta
      name="description"
      content="GastoVision turns your restaurant menu into a beautiful video experience. Scan the QR, see the dish, tell a friend and win a free dessert."
    />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/owner.css" />
  </head>
  <body>
    <!-- App shell. Pages are rendered into #view by the router. -->
    <div id="app">
      <!-- Top bar: logo + language picker -->
      <header class="topbar" id="topbar">
        <a href="#/portal" class="brand" aria-label="GastoVision home" id="brandHome">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22">
              <defs>
                <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2DD4BF" />
                  <stop offset="100%" stop-color="#FB923C" />
                </linearGradient>
              </defs>
              <path
                fill="url(#brandGrad)"
                d="M16 2c4 0 7 3 7 7v3a7 7 0 0 1-3 5.7V26a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3v-8.3A7 7 0 0 1 9 12V9c0-4 3-7 7-7Zm-2 8a2 2 0 1 1 4 0v3a2 2 0 1 1-4 0v-3Z"
              />
            </svg>
          </span>
          <span class="brand__name">GastoVision</span>
        </a>

        <button
          class="lang-btn"
          id="langBtn"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Change language"
        >
          <span class="lang-btn__flag" id="langFlag">🇬🇧</span>
          <span class="lang-btn__code" id="langCode">EN</span>
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
            <path
              d="M5 8l5 5 5-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <ul class="lang-menu" id="langMenu" role="listbox" aria-label="Languages">
          <li role="option" data-lang="en" tabindex="0">
            <span>🇬🇧</span><span>English</span>
          </li>
          <li role="option" data-lang="es" tabindex="0">
            <span>🇪🇸</span><span>Español</span>
          </li>
          <li role="option" data-lang="pt" tabindex="0">
            <span>🇵🇹</span><span>Português</span>
          </li>
          <li role="option" data-lang="fr" tabindex="0">
            <span>🇫🇷</span><span>Français</span>
          </li>
          <li role="option" data-lang="de" tabindex="0">
            <span>🇩🇪</span><span>Deutsch</span>
          </li>
        </ul>
      </header>

      <!-- Main view. The router replaces this content. -->
      <main id="view" class="view"></main>

      <!-- Bottom tab bar. Hidden on welcome / feedback flow. -->
      <nav class="tabbar" id="tabbar" aria-label="Primary">
        <a href="#/favorites" class="tab" data-tab="favorites">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 21s-7.5-4.6-9.7-9.1C.6 8.2 2.6 4 6.4 4c2 0 3.6 1 4.6 2.6h2c1-1.6 2.6-2.6 4.6-2.6 3.8 0 5.8 4.2 4 7.9C19.5 16.4 12 21 12 21Z"
            />
          </svg>
          <span data-i18n="tabs.favorites">Favorites</span>
        </a>
        <a href="#/menu" class="tab" data-tab="menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 6h14a1 1 0 010 2H5a1 1 0 010-2Zm0 5h14a1 1 0 010 2H5a1 1 0 010-2Zm0 5h14a1 1 0 010 2H5a1 1 0 010-2Z"
            />
          </svg>
          <span data-i18n="tabs.menu">Menu</span>
        </a>
        <a href="#/video" class="tab tab--center" data-tab="video">
          <span class="tab__bubble" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <path fill="currentColor" d="M8 5v14l11-7z" />
            </svg>
          </span>
          <span data-i18n="tabs.video">Video</span>
        </a>
        <a href="#/cart" class="tab" data-tab="cart">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M7 4h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2Zm1 4h8v2H8V8Zm0 4h8v2H8v-2Zm0 4h6v2H8v-2Z"
            />
          </svg>
          <span class="tab__count" id="cartCount" hidden>0</span>
          <span data-i18n="tabs.myList">My list</span>
        </a>
        <a href="#/feedback" class="tab" data-tab="feedback">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2l2.6 6.6L22 9.3l-5.5 4.7L18 22l-6-3.7L6 22l1.5-8L2 9.3l7.4-.7L12 2Z"
            />
          </svg>
          <span data-i18n="tabs.feedback">Review</span>
        </a>
      </nav>

      <!-- Toast / inline notifications -->
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <!-- Hidden entry to demo mode (sales tool). -->
      <a href="#/demo/setup" class="demo-entry-pill" id="demoEntry" title="Demo mode (sales)">
        ✨ Demo
      </a>
      <a href="#/owner/login" class="owner-entry-pill" id="ownerEntry" title="Owner / restaurant console">
        Owner
      </a>
    </div>

    <script src="assets/js/i18n.js?v=20260529"></script>
    <script src="assets/js/data.js?v=20260529"></script>
    <script src="assets/js/app.js?v=20260529"></script>
    <script>
      window.GV_GEMINI_MENU_URL = "https://gastovision-gemini-menu.mozartmorales.workers.dev/";
    </script>
    <script src="assets/js/demo.js?v=20260529"></script>
    <script src="assets/js/owner.js"></script>
  </body>
</html>
