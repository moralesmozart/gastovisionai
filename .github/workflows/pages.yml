name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Supabase config
        run: |
          {
            echo "window.GV_SUPABASE_URL = \"${{ secrets.GV_SUPABASE_URL }}\";"
            echo "window.GV_SUPABASE_ANON_KEY = \"${{ secrets.GV_SUPABASE_ANON_KEY }}\";"
            echo "window.GV_SUPABASE_SHORT_BASE = \"${{ secrets.GV_SUPABASE_SHORT_BASE }}\";"
          } > assets/js/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
